<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Food List</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Inter, Arial, sans-serif;
            background:
                radial-gradient(circle at top left, #ffe5d0, transparent 35%),
                radial-gradient(circle at bottom right, #dbeafe, transparent 35%),
                #f5f7fb;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 16px;
            color: #1f2937;
        }

        .app {
            width: 100%;
            max-width: 520px;
        }

        .card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: 24px;
            padding: 28px;
            box-shadow: 0 20px 60px rgba(31, 41, 55, 0.12);
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 14px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            background: linear-gradient(135deg, #ff7a18, #ff3d68);
            box-shadow: 0 10px 25px rgba(255, 92, 50, 0.25);
        }

        .header h1 {
            font-size: 28px;
            font-weight: 800;
            color: #111827;
            margin-bottom: 6px;
        }

        .header p {
            color: #6b7280;
            font-size: 14px;
        }

        .form {
            display: grid;
            gap: 14px;
            margin-bottom: 30px;
        }

        .input-group {
            position: relative;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 7px;
            color: #374151;
        }

        input {
            width: 100%;
            height: 48px;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 0 15px;
            font-size: 15px;
            outline: none;
            background: #f9fafb;
            transition: 0.2s ease;
        }

        input:focus {
            border-color: #ff6b35;
            background: #fff;
            box-shadow: 0 0 0 4px rgba(255, 107, 53, 0.1);
        }

        #addItems {
            height: 50px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #ff7a18, #ff3d68);
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s ease;
            box-shadow: 0 8px 20px rgba(255, 76, 48, 0.2);
        }

        #addItems:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(255, 76, 48, 0.3);
        }

        #addItems:active {
            transform: translateY(0);
        }

        .list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .list-header h2 {
            font-size: 18px;
            color: #111827;
        }

        .count {
            background: #fff0eb;
            color: #f05a28;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
        }

        #foodList {
            list-style: none;
            display: grid;
            gap: 10px;
        }

        #foodList li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 14px 15px;
            background: #f9fafb;
            border: 1px solid #f0f1f3;
            border-radius: 14px;
            transition: 0.2s ease;
        }

        #foodList li:hover {
            background: #fff;
            transform: translateX(3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
        }

        .food-info {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .food-icon {
            width: 40px;
            height: 40px;
            flex-shrink: 0;
            border-radius: 11px;
            background: #fff0eb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 19px;
        }

        .food-details {
            min-width: 0;
        }

        .food-name {
            font-size: 14px;
            font-weight: 700;
            color: #1f2937;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .food-price {
            font-size: 13px;
            color: #6b7280;
            margin-top: 3px;
        }

        .delete-btn {
            border: none;
            background: #fee2e2;
            color: #dc2626;
            padding: 8px 11px;
            border-radius: 9px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .delete-btn:hover {
            background: #dc2626;
            color: white;
        }

        .empty {
            text-align: center;
            padding: 30px 10px;
            color: #9ca3af;
            font-size: 14px;
        }

        @media (max-width: 480px) {
            .card {
                padding: 22px 18px;
                border-radius: 20px;
            }

            .header h1 {
                font-size: 24px;
            }

            #foodList li {
                padding: 12px;
            }

            .delete-btn {
                padding: 7px 9px;
            }
        }
    </style>
</head>

<body>

    <div class="app">
        <div class="card">

            <div class="header">
                <div class="icon">🍔</div>
                <h1>Food List</h1>
                <p>Add and manage your favorite food items</p>
            </div>

            <div class="form">
                <div class="input-group">
                    <label for="name">Food Name</label>
                    <input
                        type="text"
                        id="name"
                        placeholder="e.g. Pizza"
                    />
                </div>

                <div class="input-group">
                    <label for="price">Price</label>
                    <input
                        type="number"
                        id="price"
                        placeholder="e.g. 250"
                    />
                </div>

                <button id="addItems">
                    + Add Food Item
                </button>
            </div>

            <div class="list-header">
                <h2>Your Items</h2>
                <span class="count" id="itemCount">0 items</span>
            </div>

            <ul id="foodList"></ul>

        </div>
    </div>

    <script>
        let localData = JSON.parse(localStorage.getItem("food"));
        let food = localData ? localData : [];

        let addItems = document.querySelector("#addItems");
        let foodList = document.querySelector("#foodList");
        let itemCount = document.querySelector("#itemCount");

        addItems.addEventListener("click", addItemsFunc);

        displayFood();

        function addItemsFunc() {
            let name = document.querySelector("#name").value;
            let price = document.querySelector("#price").value;
            let id = Date.now();

            if (!name || !price) {
                alert("Please enter food name and price");
                return;
            }

            let collection = {
                name,
                price,
                id
            };

            food.push(collection);

            localStorage.setItem(
                "food",
                JSON.stringify(food)
            );

            document.querySelector("#name").value = "";
            document.querySelector("#price").value = "";

            displayFood();

        };

        document.querySelector("price").addEventListener("keydown", (event)=>{
            if(event.key === "Enter"){
                addItemsFunc();
            }
        });
        

        function displayFood() {
            let collection = "";

            if (food.length === 0) {
                collection = `
                    <li class="empty">
                        🍽️ No food items added yet
                    </li>
                `;
            } else {
                for (const item of food) {
                    collection += `
                        <li>
                            <div class="food-info">
                                <div class="food-icon">
                                    🍴
                                </div>

                                <div class="food-details">
                                    <div class="food-name">
                                        ${item.name}
                                    </div>

                                    <div class="food-price">
                                        ₹${item.price}
                                    </div>
                                </div>
                            </div>

                            <button
                                class="delete-btn"
                                onclick="deleteItem(${item.id})"
                            >
                                Delete
                            </button>
                        </li>
                    `;
                }
            }

            foodList.innerHTML = collection;

            itemCount.textContent =
                `${food.length} ${food.length === 1 ? "item" : "items"}`;
        }

        function deleteItem(id) {
            food = food.filter(
                (item) => item.id !== Number(id)
            );

            localStorage.setItem(
                "food",
                JSON.stringify(food)
            );

            displayFood();
        }
    </script>

</body>
</html>
